{
  "openapi": "3.0.0",
  "info": {
    "title": "Node.js Sign-up and Verification API",
    "description": "Node.js + MySQL API with email sign-up, verification, authentication and forgot password",
    "version": "1.0.0"
  },
  "servers": [
    "servers": [
  {
  "openapi": "3.0.0",
  "info": {
    "title": "Node.js Sign-up and Verification API",
    "description": "Node.js + MySQL API with email sign-up, verification, authentication and forgot password",
    "version": "1.0.0"
  },
  "servers": [
    {
      "url": "https://typescript-auth-api-u4dc.onrender.com",
      "description": "Production server"
    },
    {
      "url": "http://localhost:4000",
      "description": "Local development server"
    }
  ],
  "paths": {
  "paths": {
    "/accounts/authenticate": {
      "post": {
        "summary": "Authenticate account credentials and return a JWT token and a cookie with a refresh token",
        "tags": ["Accounts"],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "email": { "type": "string" },
                  "password": { "type": "string" }
                }
              }
            }
          }
        },
        "responses": {
          "200": { "description": "Authentication successful" },
          "400": { "description": "Invalid credentials" }
        }
      }
    },
    "/accounts/refresh-token": {
      "post": {
        "summary": "Use a refresh token to generate a new JWT token and a new refresh token",
        "tags": ["Accounts"],
        "responses": {
          "200": { "description": "Token refreshed" }
        }
      }
    },
    "/accounts/revoke-token": {
      "post": {
        "summary": "Revoke a refresh token",
        "tags": ["Accounts"],
        "responses": {
          "200": { "description": "Token revoked" }
        }
      }
    },
    "/accounts/register": {
      "post": {
        "summary": "Register a new user account and send a verification email",
        "tags": ["Accounts"],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "title": { "type": "string" },
                  "firstName": { "type": "string" },
                  "lastName": { "type": "string" },
                  "email": { "type": "string" },
                  "password": { "type": "string" },
                  "confirmPassword": { "type": "string" },
                  "acceptTerms": { "type": "boolean" }
                }
              }
            }
          }
        },
        "responses": {
          "200": { "description": "Registration successful" }
        }
      }
    },
    "/accounts/verify-email": {
      "post": {
        "summary": "Verify a new account with a verification token received by email",
        "tags": ["Accounts"],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "token": { "type": "string" }
                }
              }
            }
          }
        },
        "responses": {
          "200": { "description": "Verification successful" }
        }
      }
    },
    "/accounts/forgot-password": {
      "post": {
        "summary": "Submit email address to reset the password on an account",
        "tags": ["Accounts"],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "email": { "type": "string" }
                }
              }
            }
          }
        },
        "responses": {
          "200": { "description": "Email sent" }
        }
      }
    },
    "/accounts/validate-reset-token": {
      "post": {
        "summary": "Validate the reset password token received by email",
        "tags": ["Accounts"],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "token": { "type": "string" }
                }
              }
            }
          }
        },
        "responses": {
          "200": { "description": "Token valid" }
        }
      }
    },
    "/accounts/reset-password": {
      "post": {
        "summary": "Reset the password on an account",
        "tags": ["Accounts"],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "token": { "type": "string" },
                  "password": { "type": "string" },
                  "confirmPassword": { "type": "string" }
                }
              }
            }
          }
        },
        "responses": {
          "200": { "description": "Password reset successful" }
        }
      }
    },
    "/accounts": {
      "get": {
        "summary": "Get all accounts (Admin only)",
        "tags": ["Accounts"],
        "responses": {
          "200": { "description": "List of accounts" }
        }
      },
      "post": {
        "summary": "Create a new account (Admin only)",
        "tags": ["Accounts"],
        "responses": {
          "200": { "description": "Account created" }
        }
      }
    },
    "/accounts/{id}": {
      "get": {
        "summary": "Get account by ID",
        "tags": ["Accounts"],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": { "type": "string" }
          }
        ],
        "responses": {
          "200": { "description": "Account details" }
        }
      },
      "put": {
        "summary": "Update an account",
        "tags": ["Accounts"],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": { "type": "string" }
          }
        ],
        "responses": {
          "200": { "description": "Account updated" }
        }
      },
      "delete": {
        "summary": "Delete an account",
        "tags": ["Accounts"],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": { "type": "string" }
          }
        ],
        "responses": {
          "200": { "description": "Account deleted" }
        }
      }
    }
  }
}